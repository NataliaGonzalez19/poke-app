<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <style>
    body {
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div id="demo"></div>

  <script type="module">
    import { html, render } from 'lit';
    import '../modal-info-ui.js';

    const header = 'Hello owc World!';
    render(
      html`
        <modal-info-ui .textInfo=${header}>
        </modal-info-ui>
      `,
      document.querySelector('#demo')
    );
    document.addEventListener('DOMContentLoaded',event =>{
      const modal = document.querySelector('modal-info-ui');
      modal.openModal();
    });
  </script>
</body>
</html>
